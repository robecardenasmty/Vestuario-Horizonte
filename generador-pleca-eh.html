  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

        e.target.tagName, String(e.target.src || e.target.href || ''));

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

· Lower third<\u002Fdiv>\n      <div style=\"font-size:12px;font-weight:500;color:#7e8ea3;line-height:1.5;margin-top:6px\">Edita los valores y se actualizan en vivo. El PNG se exporta exactamente como lo ves.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;padding:12px 12px 20px\">\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px\">\n        <button style=\"{{ modeSeg.news }}\" data-val=\"news\" sc-camel-on-click=\"{{ setMode }}\">📰 Noticia<\u002Fbutton>\n        <button style=\"{{ modeSeg.social }}\" data-val=\"social\" sc-camel-on-click=\"{{ setMode }}\">📣 Síguenos<\u002Fbutton>\n      <\u002Fdiv>\n\n      <details open=\"open\" style=\"border:1px solid #232c39;border-radius:12px;background:#10151a;margin-bottom:10px\">\n        <summary style=\"cursor:pointer;display:flex;align-items:center;gap:9px;padding:12px 13px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:#cdd9ea;user-select:none\"><span class=\"chev\" style=\"display:inline-block;transition:transform .18s;font-size:10px;color:#7e8ea3\">▶<\u002Fspan>✏️ Titular<\u002Fsummary>\n        <div style=\"padding:2px 13px 13px;display:flex;flex-direction:column;gap:11px\">\n          <div>\n            <span style=\"display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7e8ea3;margin-bottom:5px\">Categoría (cintillo)<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <input data-key=\"tag\" value=\"{{ tag }}\" sc-camel-on-change=\"{{ onField }}\" style=\"flex:1;min-width:0;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;padding:9px 11px;box-sizing:border-box\">\n              <label style=\"display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#7e8ea3;cursor:pointer;flex:none\"><input type=\"checkbox\" data-key=\"showTag\" checked=\"{{ showTag }}\" sc-camel-on-change=\"{{ onCheck }}\" style=\"width:15px;height:15px;cursor:pointer\">Visible<\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isNews }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <span style=\"display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7e8ea3;margin-bottom:5px\">Titular (Enter = salto de línea)<\u002Fspan>\n              <textarea data-key=\"title\" value=\"{{ title }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" style=\"width:100%;resize:vertical;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;padding:9px 11px;box-sizing:border-box;line-height:1.45\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div>\n              <span style=\"display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7e8ea3;margin-bottom:5px\">Bajada (barra inferior)<\u002Fspan>\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <input data-key=\"sub\" value=\"{{ sub }}\" sc-camel-on-change=\"{{ onField }}\" style=\"flex:1;min-width:0;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;padding:9px 11px;box-sizing:border-box\">\n                <label style=\"display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#7e8ea3;cursor:pointer;flex:none\"><input type=\"checkbox\" data-key=\"showSub\" checked=\"{{ showSub }}\" sc-camel-on-change=\"{{ onCheck }}\" style=\"width:15px;height:15px;cursor:pointer\">Visible<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isSocial }}\" hint-placeholder-val=\"{{ false }}\">\n            < #0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:500;font-size:12.5px;padding:8px 10px;box-sizing:border-box\">\n              <\u002Fdiv>\n              <div>\n                <span style=\"display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7e8ea3;margin-bottom:5px\">Facebook<\u002Fspan>\n                <input data-key=\"hFB\" value=\"{{ hFB }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:500;font-size:12.5px;padding:8px 10px;box-sizing:border-box\">\n              <\u002Fdiv>\n              <div>\n                <span style=\"display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7e8ea3;margin-bottom:5px\">YouTube<\u002Fspan>\n                <input data-key=\"hYT\" value=\"{{ hYT }}\" sc-camel-on-change=\"{{ onField }}\" style=\"width:100%;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:500;font-size:12.5px;padding:8px 10px;box-sizing:border-box\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:500;color:#6a7889;line-height:1.5\">Los logos de las redes son fijos; los usuarios de cada red sí se pueden editar.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details open=\"open\" style=\"border:1px solid #232c39;border-radius:12px;background:#10151a;margin-bottom:10px\">\n        <summary style=\"cursor:pointer;display:flex;align-items:center;gap:9px;padding:12px 13px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:#cdd9ea;user-select:none\"><span class=\"chev\" style=\"display:inline-block;transition:transform .18s;font-size:10px;color:#7e8ea3\">▶<\u002Fspan>🌆 Ciudades y clima<\u002Fsummary>\n        <div style=\"padding:2px 13px 13px;display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ cities }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"background:#0b1016;border:1px solid #232c39;border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7e8ea3\">{{ c.label }}<\u002Fspan>\n              <input data-idx=\"{{ $index }}\" data-key=\"name\" value=\"{{ c.name }}\" sc-camel-on-change=\"{{ onCity }}\" style=\"width:100%;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;padding:9px 11px;box-sizing:border-box\">\n              <div style=\"display:flex;gap:8px\">\n                <input data-idx=\"{{ $index }}\" data-key=\"temp\" value=\"{{ c.temp }}\" sc-camel-on-change=\"{{ onCity }}\" sc-camel-input-mode=\"numeric\" sc-camel-max-length=\"4\" style=\"width:74px;flex:none;text-align:center;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;padding:9px 6px;box-sizing:border-box\" placeholder=\"°\">\n                <sc-raw-select data-idx=\"{{ $index }}\" data-key=\"icon\" value=\"{{ c.icon }}\" sc-camel-on-change=\"{{ onCity }}\" style=\"flex:1;min-width:0;background:#0c1118;border:1px solid #2a3340;border-radius:8px;color:#e7edf6;font-family:'Barlow',sans-serif;font-weight:500;font-size:13px;padding:9px 8px;box-sizing:border-box;cursor:pointer\">\n                  <option value=\"sunny\">☀ Soleado<\u002Foption>\n                  <option value=\"partly\">⛅ Medio nublado<\u002Foption>\n                  <option value=\"cloudy\">☁ Nublado<\u002Foption>\n                  <option value=\"rain\">🌧 Lluvia<\u002Foption>\n                  <option value=\"sto color:#7e8ea3;margin-bottom:5px\">Logo<\u002Fspan>\n            <div style=\"display:flex;gap:8px\">\n              <button sc-camel-on-click=\"{{ pickLogo }}\" style-hover=\"border-color:#f47b20;color:#e7edf6\" style=\"flex:1;padding:10px;border-radius:9px;background:#0c1118;border:1px solid #2c3a4d;color:#cdd9ea;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s\">📷 Subir logo<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ resetLogo }}\" style-hover=\"border-color:#f47b20;color:#e7edf6\" style=\"flex:none;padding:10px 12px;border-radius:9px;background:#0c1118;border:1px solid #2c3a4d;color:#cdd9ea;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s\">↺ EH<\u002Fbutton>\n            <\u002Fdiv>\n            <input type=\"file\" accept=\"image/*\" ref=\"{{ logoInputRef }}\" sc-camel-on-change=\"{{ onLogoFile }}\" style=\"display:none\">\n            <div style=\"font-size:11px;font-weight:500;color:#6a7889;line-height:1.5;margin-top:7px\">El logo EH original ya viene cargado. \"↺ EH\" lo restaura.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ resetBrand }}\" style-hover=\"border-color:#f47b20;color:#e7edf6\" style=\"padding:9px;border-radius:9px;background:transparent;border:1px solid #2a3340;color:#7e8ea3;font-family:'Barlow',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.03em;cursor:pointer;transition:all .15s\">Restaurar colores originales<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details style=\"border:1px solid #232c39;border-radius:12px;background:#10151a;margin-bottom:10px\">\n        <summary style=\"cursor:pointer;display:flex;align-items:center;gap:9px;padding:12px 13px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:#cdd9ea;user-select:none\"><span class=\"chev\" style=\"display:inline-block;transition:transform .18s;font-size:10px;color:#7e8ea3\">▶<\u002Fspan>🖼️ Fondo de previsualización<\u002Fsummary>\n        <div style=\"padding:2px 13px 13px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px\">\n            <button style=\"{{ bgSeg.transparent }}\" data-val=\"transparent\" sc-camel-on-click=\"{{ setBg }}\">Transparente<\u002Fbutton>\n            <button style=\"{{ bgSeg.black }}\" data-val=\"black\" sc-camel-on-click=\"{{ setBg }}\">Negro<\u002Fbutton>\n            <button style=\"{{ bgSeg.green }}\" data-val=\"green\" sc-camel-on-click=\"{{ setBg }}\">Chroma verde<\u002Fbutton>\n            <button style=\"{{ bgSeg.blue }}\" data-val=\"blue\" sc-camel-on-click=\"{{ setBg }}\">Chroma azul<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <button sc-camel-on-click=\"{{ pickBg }}\" style-hover=\"border-color:#f47b20;color:#e7edf6\" style=\"flex:1;padding:10px;border-radius:9px;background:#0c1118;border:1px solid #2c3a4d;color:#cdd9ea;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s\">🖼️ Imagen propia<\u002Fbutton>\n            <sc-if value=\"{{ hasBgImage }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ clearBgImage }}\" style-hover=\"border-color:#e23b3b;color:#e7edf6\" style=\"flex:none;padding:10px 12px;border-radius:9px;background:#0c1118;border:1px solid #2c3a4d;color:#cdd9ea;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s\">✕ Quitar<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <input type=\"file\" accept=\"image/*\" ref=\"{{ bgInputRef }}\" sc-camel-on-change=\ n      { name: 'MONTERREY', temp: '31', icon: 'sunny' },\n      { name: 'COAHUILA', temp: '33', icon: 'partly' },\n      { name: 'TAMAULIPAS', temp: '29', icon: 'rain' }\n    ],\n    accent: '', band: '#4a4a49', bg: 'transparent', bgImage: null,\n    logoSrc: '', scale: 2, stageScale: 0.42, busy: false, toast: ''\n  };\n  componentDidMount() {\n    this._loadLogo();\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this._fit());\n    setTimeout(() => this._fit(), 300);\n  }\n  componentDidUpdate() { this._fit(); }\n  componentWillUnmount() { if (this._ro) this._ro.disconnect(); clearTimeout(this._tt); }\n  _loadLogo() {\n    this._logoReady = fetch('assets/eh-logo.png')\n      .then(r => r.blob())\n      .then(b => new Promise(res => {\n        const fr = new FileReader();\n        fr.onload = () => { this.setState({ logoSrc: fr.result }); res(); };\n        fr.readAsDataURL(b);\n      })).catch(() => {});\n  }\n  _resize() {\n    const el = this._stageBox; if (!el) return;\n    const s = Math.max(.05, Math.min((el.clientWidth - 70) / 1920, (el.clientHeight - 70) / 1080));\n    if (Math.abs(s - this.state.stageScale) > .002) this.setState({ stageScale: s });\n  }\n  _fit() {\n    const root = this._canvas; if (!root) return;\n    root.querySelectorAll('[data-fit]').forEach(el => {\n      const max = +el.dataset.fit || 30, pad = +el.dataset.pad || 0, box = el.parentElement;\n      if (!box) return;\n      let s = max; el.style.fontSize = s + 'px';\n      const over = () => el.scrollWidth > box.clientWidth - pad || el.scrollHeight > box.clientHeight + 2;\n      let guard = 40;\n      while (over() && s > 13 && guard--) { s -= 1; el.style.fontSize = s + 'px'; }\n    });\n  }\n  _toast(m) { clearTimeout(this._tt); this.setState({ toast: m }); this._tt = setTimeout(() => this.setState({ toast: '' }), 2800); }\n  _lighten(hex, t) {\n    const h = (hex || '#c6de00').replace('#', '');\n    const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h.padEnd(6, '0');\n    const mix = i => Math.round(parseInt(n.slice(i, i + 2), 16) * (1 - t) + 255 * t).toString(16).padStart(2, '0');\n    return '#' + mix(0) + mix(2) + mix(4);\n  }\n  async _export(only) {\n    if (this.state.busy) return;\n    if (!window.EHExport) { this._toast('⚠️ El motor de exportación no cargó'); return; }\n    this.setState({ busy: true });\n    try {\n      await (this._logoReady || Promise.resolve());\n      if (document.fonts && document.fonts.ready) await document.fonts.ready;\n      const sc = this.state.scale;\n      const transparent = this.state.bg === 'transparent';\n      const name = this.state.mode === 'social' ? 'siguenos' : 'noticia';\n      if (only) {\n        await window.EHExport.png({ stage: this._canvas, node: this._pleca, scale: sc, hideBg: true, filename: `pleca-EH-${name}_${1810 * sc}x${285 * sc}_alfa.png` });\n      } else {\n        await window.EHExport.png({ stage: this._canvas, scale: sc, hideBg: transparent, filename: `cuadro-EH-${name}_${1920 * sc}x${1080 * sc}${transparent ? '_alfa' : ''}.png` });\n      }\n      this._toast('✓ PNG exportado');\n    } catch (err) {\n      this._toast('⚠️ Error al exportar: ' + ((err && err.message) || err));\n    }\n    this.setState({ busy: false });\n  }\n  renderVals() {\n    const s = this.state;\n    const accent = s.accent || this.props.acento || '#c6de00';\n    const seg = on => ({\n      padding: '9px 6px', borderRadius: '8px', fontFamily: \"'Barlow',sans-serif\", fontWeight: '700',\n      fontSize: '11.5px', letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer',\n      textAlign: 'center', transition: 'all .15s',\n      border: '1px solid ' + (on ? '#f47b20' : '#2a3340'),\n      background: on ? '#241608' : '#0c1118', color: on ? '#ffd9a8' : '#aebdd0'\n    });\n    const bgMap = {\n      transparent: 'conic-gradient(#e9ebee 25%,#ccd1d8 0 50%,#e9ebee 0 75%,#ccd1d8 0) 0 0 / 56px 56px',\n      black: '#000000', green: '#00b140', blue: '#1f60c4', image: '#000000'\n    };\n    return {\n      tag: s.tag, showTag: s.showTag, title: s.title, sub: s.sub, showSub: s.showSub,\n      isNews: s.mode === 'news', isSocial: s.mode === 'social',\n      socialTitle: s.socialTitle, socialMsg: s.socialMsg,\n      hX: s.hX, hIG: s.hIG, hFB: s.hFB, hYT: s.hYT,\n      colTop: s.showTag ? 0 : 68, colH: s.showTag ? 285 : 217,\n      modeSeg: { news: seg(s.mode === 'news'), social: seg(s.mode === 'social') },\n      accent, band: s.band, busy: s.busy, toast: s.toast,\n      logoLayer: { width: '178px', height: '178px', transform: 'skewX(12deg)', backgroundImage: s.logoSrc ? 'url(' + s.logoSrc + ')' : 'none', backgroundSize: 'contain', backgroundRepeat: 'no-repeat', backgroundPosition: 'center' },\n      bottomPx: this.props.margenInferior ?? 90,\n      plecaSize: `${1810 * s.scale}×${285 * s.scale}px`,\n      zoomPct: Math.round(s.stageScale * 100) + '%',\n      canvasTf: 'translate(-50%,-50%) scale(' + s.stageScale + ')',\n      bgLayer: { position: 'absolute', left: '0', top: '0', width: '100%', height: '100%', background: bgMap[s.bg] || '#000' },\n      bgImgLayer: { position: 'absolute', left: '0', top: '0', width: '100%', height: '100%', backgroundImage: s.bgImage ? 'url(' + s.bgImage + ')' : 'none', backgroundSize: 'cover', backgroundPosition: 'center' },\n      hasBgImage: s.bg === 'image' && !!s.bgImage, bgImage: s.bgImage,\n      cities: s.cities.map((c, i) => ({\n        name: c.name, temp: c.temp, icon: c.icon, label: 'Ciudad ' + (i + 1),\n        tempLabel: (c.temp === '' ? '–' : c.temp) + '°',\n        iconPath: this.ICONS[c.icon] || this.ICONS.sunny,\n        tempLeft: Math.round(1167 + i * 197.33)\n      })),\n      bgSeg: { transparent: seg(s.bg === 'transparent'), black: seg(s.bg === 'black'), green: seg(s.bg === 'green'), blue: seg(s.bg === 'blue') },\n      scaleSeg: { s1: seg(s.scale === 1), s2: seg(s.scale === 2) },\n      onField: e => this.setState({ [e.target.dataset.key]: e.target.value }),\n      onCheck: e => this.setState({ [e.target.dataset.key]: e.target.checked }),\n      onCity: e => {\n        const i = +e.target.dataset.idx, k = e.target.dataset.key, v = e.target.value;\n        this.setState({ cities: this.state.cities.map((c, j) => j === i ? { ...c, [k]: v } : c) });\n      },\n      onAccent: e => this.setState({ accent: e.target.value }),\n      onBand: e => this.setState({ band: e.target.value }),\n      resetBrand: () => this.setState({ accent: '', band: '#4a4a49' }),\n      setMode: e => {\n        const m = e.currentTarget.dataset.val, def = { news: 'MOVILIDAD', social: 'SÍGUENOS' };\n        this.setState(st => ({ mode: m, tag: (st.tag === 'MOVILIDAD' || st.tag === 'SÍGUENOS') ? def[m] : st.tag }));\n      },\n      setBg: e => this.setState({ bg: e.currentTarget.dataset.val }),\n      setScale: e => this.setState({ scale: +e.currentTarget.dataset.val }),\n      pickLogo: () => this._logoInput && this._logoInput.click(),\n      onLogoFile: e => {\n        const f = e.target.files && e.target.files[0]; if (!f) return;\n        const fr = new FileReader(); fr.onload = () => this.setState({ logoSrc: fr.result });\n        fr.readAsDataURL(f); e.target.value = '';\n      },\n      resetLogo: () => this._loadLogo(),\n      pickBg: () => this._bgInput && this._bgInput.click(),\n      onBgFile: e => {\n        const f = e.target.files && e.target.files[0]; if (!f) return;\n        const fr = new FileReader(); fr.onload = () => this.setState({ bgImage: fr.result, bg: 'image' });\n        fr.readAsDataURL(f); e.target.value = '';\n      },\n      clearBgImage: () => this.setState({ bgImage: null, bg: 'transparent' }),\n      exportPleca: () => this._export(true),\n      exportFrame: () => this._export(false),\n      stageBoxRef: el => {\n        this._stageBox = el;\n        if (el && !this._ro && window.ResizeObserver) {\n          this._ro = new ResizeObserver(() => this._resize());\n          this._ro.observe(el); this._resize();\n        }\n      },\n      canvasRef: el => { this._canvas = el; },\n      plecaRef: el => { this._pleca = el; },\n      logoInputRef: el => { this._logoInput = el; },\n      bgInputRef: el => { this._bgInput = el; }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
